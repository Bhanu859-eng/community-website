<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join IBB — Indian Business Bureau</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f7fb;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    .top {
      text-align: center;
      margin-bottom: 25px;
    }

    .top h1 {
      font-size: 28px;
      color: #111;
      margin-bottom: 8px;
    }

    .top p {
      color: #666;
      font-size: 15px;
    }

    .form-box {
      background: #fff;
      padding: 30px 25px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.10);
    }

    .form-box h2 {
      font-size: 22px;
      margin-bottom: 22px;
      color: #111;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 14px;
      border: 1px solid #d5d5d5;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
      background: #fff;
    }

    .field input:focus,
    .field select:focus {
      border-color: #111;
    }

    .submit-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .submit-btn:hover {
      opacity: 0.88;
    }

    .fee {
      text-align: center;
      margin: 20px 0;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      color: #333;
    }

    .fee strong {
      font-size: 22px;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .small-note {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #777;
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .form-box {
        padding: 25px 18px;
      }

      .top h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="top">
      <h1>INDIAN BUSINESS BUREAU</h1>
      <p>Membership Registration</p>
    </div>

    <div class="form-box">

      <h2>Register for IBB Membership</h2>

      <form id="registrationForm">

        <div class="field">
          <label for="name">Full Name *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="field">
          <label for="mobile">Mobile Number *</label>
          <input
            type="tel"
            id="mobile"
            name="mobile"
            placeholder="Enter mobile number"
            pattern="[0-9]{10}"
            maxlength="10"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email Address *</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          >
        </div>

        <div class="field">
          <label for="city">City *</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Enter your city"
            required
          >
        </div>

        <div class="field">
          <label for="state">State *</label>
          <select id="state" name="state" required>
            <option value="">Select State</option>
            <option>Punjab</option>
            <option>Haryana</option>
            <option>Delhi</option>
            <option>Himachal Pradesh</option>
            <option>Rajasthan</option>
            <option>Uttar Pradesh</option>
            <option>Maharashtra</option>
            <option>Gujarat</option>
            <option>Madhya Pradesh</option>
            <option>West Bengal</option>
            <option>Bihar</option>
            <option>Jharkhand</option>
            <option>Odisha</option>
            <option>Chhattisgarh</option>
            <option>Uttarakhand</option>
            <option>Jammu & Kashmir</option>
            <option>Other</option>
          </select>
        </div>

        <div class="fee">
          Membership Registration Fee:
          <br>
          <strong>₹101</strong>
        </div>

        <button type="submit" class="submit-btn">
          CONTINUE TO ₹101 PAYMENT
        </button>

      </form>

      <a href="index.html" class="back">
        ← Back to Home
      </a>

      <div class="small-note">
        After submitting your registration details, you will be
        redirected to the ₹101 UPI payment page.
      </div>

    </div>

  </div>


  <script>

    document
      .getElementById("registrationForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const email = document.getElementById("email").value.trim();
        const business = document.getElementById("business").value.trim();
        const city = document.getElementById("city").value.trim();
        const state = document.getElementById("state").value;

        // Basic validation
        if (!name || !mobile || !email || !city || !state) {
          alert("Please fill all required fields.");
          return;
        }

        if (!/^[0-9]{10}$/.test(mobile)) {
          alert("Please enter a valid 10-digit mobile number.");
          return;
        }

        // Save registration details temporarily
        sessionStorage.setItem("ibb_name", name);
        sessionStorage.setItem("ibb_mobile", mobile);
        sessionStorage.setItem("ibb_email", email);
        sessionStorage.setItem("ibb_business", business);
        sessionStorage.setItem("ibb_city", city);
        sessionStorage.setItem("ibb_state", state);

        // DIRECTLY OPEN PAYMENT PAGE
        window.location.href = "payment.html";

      });

  </script>

</body>
</html>
